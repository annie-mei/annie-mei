on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

name: Disposable QA journeys

permissions:
  contents: read

jobs:
  qa:
    name: Run QA journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        run: |
          toolchain="$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2 }' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: "true"
          prefix-key: "annie-mei"
          shared-key: "cargo-qa"
      - name: Test QA runner
        run: scripts/test-qa.sh
      - name: Run QA journeys
        run: scripts/qa.sh
      - name: Upload QA results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: qa-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/qa/
          if-no-files-found: warn
